name: Release preparation checks
on:
  pull_request:
  push:
    branches: [feat/app-store-release-preparation, feat/live-x-credits]
jobs:
  packaging-and-deletion:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run verify
      - run: node scripts/verify-billing.mjs
      - run: node scripts/verify-apple-proof.mjs
        if: github.ref == 'refs/heads/feat/live-x-credits'
      - run: npm run verify:release
      - run: node scripts/package-backend.mjs
      - run: node scripts/verify-backend-redis.mjs
        env:
          REDIS_TEST_DISPOSABLE: '1'
  billing-native-compile:
    if: github.ref == 'refs/heads/feat/live-x-credits'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Compile native StoreKit bridge without signing or uploading
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
