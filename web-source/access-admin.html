<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>VerioDetect — Access administration</title><style>body{font:16px system-ui;background:#101d30;color:#f4f6fa;max-width:950px;margin:40px auto;padding:20px}input,button{padding:10px;margin:4px;border-radius:7px}article{border:1px solid #536b88;padding:15px;margin:12px 0;border-radius:12px}button{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#24334a;padding:12px}small{color:#b4c8e2}</style></head><body><h1>VerioDetect — private access approvals</h1><p>Administrator token is used only for requests and is not saved in the browser.</p><label>Administrator token <input id="token" type="password" autocomplete="off"></label><button id="load">Load requests</button><p id="message" role="status"></p><div id="requests"></div><script>
const $=id=>document.getElementById(id);let records=[];
async function api(method,body){const r=await fetch('/api/access-admin',{method,headers:{authorization:'Bearer '+$('token').value,'content-type':'application/json'},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
function el(tag,text){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;return x}
async function load(){try{const j=await api('GET');records=j.requests;$('requests').replaceChildren();for(const rec of records){const a=el('article'),h=el('h3',rec.name+' — '+rec.status),p=el('p',rec.email),reason=el('small',rec.reason||'No reason provided');a.append(h,p,reason);if(rec.status==='pending'){const q=el('input');q.type='number';q.min='1';q.max='100';q.value='10';q.title='Daily quota';const exp=el('input');exp.type='date';const approve=el('button','Approve and generate code'),reject=el('button','Reject');approve.onclick=()=>act(rec.id,'approve',Number(q.value),exp.value);reject.onclick=()=>act(rec.id,'reject');a.append(el('p','Daily quota / optional expiry:'),q,exp,approve,reject)}if(rec.status==='approved'){const revoke=el('button','Revoke access');revoke.onclick=()=>act(rec.id,'revoke');a.append(revoke)}$('requests').append(a)}$('message').textContent=records.length+' requests loaded.'}catch(e){$('message').textContent=e.message}}
async function act(id,action,quota,expires){if(action==='revoke'&&!confirm('Revoke this user’s access?'))return;try{const j=await api('POST',{id,action,quota,expires});if(j.code){$('message').replaceChildren(el('strong','New code — copy now (shown once):'),el('pre',j.code),el('p',j.notice))}else $('message').textContent='Action completed.';await load();if(j.code){$('message').replaceChildren(el('strong','New code — copy now (shown once):'),el('pre',j.code),el('p',j.notice))}}catch(e){$('message').textContent=e.message}}
$('load').onclick=load;
</script></body></html>
