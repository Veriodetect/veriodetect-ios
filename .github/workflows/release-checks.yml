name: Release preparation checks
on:
  pull_request:
  push:
    branches: [feat/app-store-release-preparation, feat/live-x-credits]
jobs:
  packaging-and-deletion:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run verify
      - run: node scripts/verify-billing.mjs
      - run: npm run verify:release
      - run: node scripts/package-backend.mjs
      - run: node scripts/verify-backend-redis.mjs
        env:
          REDIS_TEST_DISPOSABLE: '1'
